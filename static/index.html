<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b34;
    --accent: #6ea8fe;
    --text: #e6e8eb;
    --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h1 { font-size: 16px; margin: 0 0 4px; }
  #sidebar p.sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  #dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 18px 10px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  #dropzone:hover { border-color: var(--accent); color: var(--text); }
  #docList { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  #docList li {
    padding: 6px 8px;
    background: #1d222b;
    border-radius: 6px;
    margin-bottom: 6px;
    word-break: break-word;
  }
  button {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chatWindow { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #0f1115; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .sources { margin-top: 8px; font-size: 11px; color: var(--muted); }
  #inputBar { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border); }
  #inputBar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
  }
  #inputBar input:focus { outline: none; border-color: var(--accent); }
  #fileInput { display: none; }
</style>
</head>
<body>
  <div id="sidebar">
    <div>
      <h1>Conversational RAG Chatbot</h1>
      <p class="sub">Local semantic search with Sentence Transformers + ChromaDB, powered by Groq LLMs.</p>
    </div>
    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
      Click to upload a PDF / DOCX / TXT
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt" />
    <div>
      <p class="sub" style="margin-bottom:6px;">Documents in store</p>
      <ul id="docList"></ul>
    </div>
    <button class="secondary" onclick="resetChat()">Clear chat history</button>
  </div>

  <div id="main">
    <div id="chatWindow">
      <div class="msg bot">Upload a document, then ask me anything about it.</div>
    </div>
    <div id="inputBar">
      <input id="questionInput" type="text" placeholder="Ask a question..." />
      <button onclick="sendQuestion()">Send</button>
    </div>
  </div>

<script>
const chatWindow = document.getElementById('chatWindow');
const fileInput = document.getElementById('fileInput');
const questionInput = document.getElementById('questionInput');

function addMessage(text, cls, sourcesHtml = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = text + sourcesHtml;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function refreshDocs() {
  const res = await fetch('/api/documents');
  const data = await res.json();
  const list = document.getElementById('docList');
  list.innerHTML = '';
  data.sources.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    list.appendChild(li);
  });
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  addMessage(`Uploading <b>${file.name}</b>...`, 'bot');
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    addMessage(`✅ Indexed <b>${data.filename}</b> — ${data.chunks_added} chunks added.`, 'bot');
    refreshDocs();
  } catch (e) {
    addMessage(`❌ ${e.message}`, 'bot');
  }
  fileInput.value = '';
});

async function sendQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;
  addMessage(question, 'user');
  questionInput.value = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    const sourcesHtml = data.sources.length
      ? `<div class="sources">Sources: ${data.sources.map(s => s.source + (s.page > 0 ? ` (p.${s.page})` : '')).join(', ')}</div>`
      : '';
    addMessage(data.answer, 'bot', sourcesHtml);
  } catch (e) {
    addMessage(`❌ ${e.message}`, 'bot');
  }
}

questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuestion();
});

async function resetChat() {
  await fetch('/api/reset', { method: 'POST' });
  chatWindow.innerHTML = '<div class="msg bot">Chat history cleared. Ask away.</div>';
}

refreshDocs();
</script>
</body>
</html>
